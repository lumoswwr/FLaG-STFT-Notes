site_name: FLaG / STFT Mechanism Experiments
site_description: FLaG / STFT 实验配置、指标与机制分析
site_url: https://lumoswwr.github.io/FLaG-STFT-Notes/

nav:
  - 首页: index.md
  - 实验协议与指标: methods.md
  - 研究结果综述: findings.md
  - STSB:
      - E1–E8：算子探索与机制探针: stsb/01-experiments.md
      - E9–E14：Padding、窗口与配置: stsb/02-padding.md
      - 循环反射、P1 与 P2: stsb/03-mechanism.md
  - Sprint:
      - 数据、训练与指标: sprint/01-protocol.md
      - S1–S5：跨任务实验与控制: sprint/02-experiments.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
