site_name: FLaG / STFT Mechanism Experiments
site_description: FLaG 与 STFT-FLaG 的实验结果与机制分析
site_url: https://lumoswwr.github.io/FLaG-STFT-Notes/
nav:
  - 概览: index.md
  - 实验协议与评价: methods.md
  - "STFT 窗口设计与 STSB 配置对照": chapters/01-stft-window.md
  - "STFT 的频率和 Token 响应": chapters/02-token-frequency.md
  - "Padding 敏感性与 Global/Local 重建机制": chapters/03-padding-reconstruction.md
  - "Sprint 跨任务表现与配置控制": chapters/04-sprint.md
  - "最低频带信息与 DC 训练干预": chapters/05-dc-bands.md
  - "Mean 与 FLaG 的向量融合": chapters/06-mean-fusion.md
  - "Gate 与 Projection 的逐阶段作用": chapters/07-gate-projection.md
  - "Mean + Projection 的简化结构对照": chapters/08-simplified-pooling.md
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
