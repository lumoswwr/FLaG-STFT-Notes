site_name: FLaG / STFT Mechanism Experiments
site_description: 按实验事实与协议重构的 FLaG / STFT 研究记录
site_url: https://lumoswwr.github.io/FLaG-STFT-Notes/

nav:
  - 首页: index.md
  - 实验设置和指标: methods.md
  - 事实结果索引: findings.md
  - 逐项实验导航: experiments/index.md
  - STSB E1–E14:
      - 'E01 Global Hann': experiments/stsb-e01.md
      - 'E02 STFT 16/8（初次局部变换）': experiments/stsb-e02.md
      - 'E03 STFT 8/4（缩短窗口）': experiments/stsb-e03.md
      - 'E04 Learned frame position': experiments/stsb-e04.md
      - 'E05 局部 Hann 与 centering': experiments/stsb-e05.md
      - 'E06 最终层频带 Knockout': experiments/stsb-e06.md
      - 'E07 Token hidden knockout': experiments/stsb-e07.md
      - 'E08 DC attention 偏好比': experiments/stsb-e08.md
      - 'E09 右侧额外 Padding 与输出漂移': experiments/stsb-e09.md
      - 'E10 四种 Padding 推理方式': experiments/stsb-e10.md
      - 'E11 无重叠 STFT 8/8': experiments/stsb-e11.md
      - 'E12 无重叠 STFT 16/16 与十种子复核': experiments/stsb-e12.md
      - 'E13 固定全局 FFT 长度': experiments/stsb-e13.md
      - 'E14 论文 Text 设置下的十种子对照': experiments/stsb-e14.md
  - Sprint S1–S5:
      - 'S01 Sprint 早期三种子基线': experiments/sprint-s01.md
      - 'S02 Sprint 十种子扩展': experiments/sprint-s02.md
      - 'S03 Sprint Global/Local Gate × Reconstruction': experiments/sprint-s03.md
      - 'S04 匹配配置的 Global / Local 对照': experiments/sprint-s04.md
      - 'S05 Global FLaG 的 Dropout × Norm 因子实验': experiments/sprint-s05.md
  - P1/P2 与机制:
      - 'Reflection 实虚门控的循环反射恒等式': experiments/mech-reflection.md
      - 'P1 FFT Gate 长度与重建长度分离': experiments/mech-p1.md
      - 'P2 STSB Global/Local Gate × Reconstruction': experiments/mech-p2.md
  - DC 与频带:
      - 'dc-band DCT 频带 Knockout、Band-only 与层深变化': experiments/dc-band.md
      - 'dc-exact 训练时删除或仅保留 exact DC': experiments/dc-exact.md
  - Gate 与 Projection:
      - 'gate-stages DC、Gate 和 Projection 的向量方向变化': experiments/gate-stages.md
      - 'gate-input 跨句 Gate 变化与 Sigmoid 饱和': experiments/gate-input.md
      - 'gate-counterfactual 训练后关闭 DC/AC Gate 与 Projection': experiments/gate-counterfactual.md
      - 'gate-projection 从头训练 Mean + Projection 与严格同初始化对照': experiments/gate-projection.md
  - Mean-compatible 与 Alignment-aware:
      - 'mean-residual Mean/FLaG 直接残差插值': experiments/mean-residual.md
      - 'mean-anchor 正交 Mean-anchor 与无界 Beta': experiments/mean-anchor.md
      - 'mean-alignment Alignment-aware 结构与 StopGrad 消融': experiments/mean-alignment.md
      - '5-seed 三项文本任务的统一 5-seed 对照': experiments/mean-final.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
