site_name: FLaG / STFT Mechanism Experiments
site_description: FLaG / STFT 实验配置、指标与机制分析
site_url: https://lumoswwr.github.io/FLaG-STFT-Notes/

nav:
  - 首页: index.md
  - 实验协议与指标: methods.md
  - 研究结果综述: findings.md
  - MTEB数据集三种文本任务观察感受: MTEB.md
  - DC / 频带机制: dc-frequency.md
  - Mean-compatible FLaG: mean-compatible-flag.md
  - FLaG 门控与输出线性投影: flag-gate-projection.md

  - STSB:
      - E1–E8: stsb/01-experiments.md
      - E9–E14: stsb/02-padding.md
      - 循环反射与 P1/P2: stsb/03-mechanism.md

  - Sprint:
      - 数据与训练: sprint/01-protocol.md
      - S1–S5: sprint/02-experiments.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js