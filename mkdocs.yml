site_name: FLaG / STFT Mechanism Experiments
site_description: FLaG / STFT 实验配置、指标与机制分析
site_url: https://lumoswwr.github.io/FLaG-STFT-Notes/

nav:
  - 首页：从这里开始: index.md
  - 研究过程与结果总结: findings.md
  - 实验设置与指标: methods.md
  - 文本任务与研究假设: MTEB.md

  - 第一阶段：STFT 结构探索（STSB）:
      - E1–E8：窗口与频率分析: stsb/01-experiments.md
      - E9–E14：Padding 与配置比较: stsb/02-padding.md
      - 循环反射、P1/P2 机制: stsb/03-mechanism.md

  - 第二阶段：Sprint 验证:
      - 数据集与训练协议: sprint/01-protocol.md
      - S1–S5：性能与配置对照: sprint/02-experiments.md

  - 第三阶段：频率与 Mean:
      - DC 与各频带的作用: dc-frequency.md
      - Mean 与 FLaG 的融合: mean-compatible-flag.md

  - 第四阶段：经典 LTR 排序实验（STSB）:
      - 六种排序目标与三种模型: ltr.md


theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
